<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CAMPUS LEGENDS | 起動の復旧</title><style>body{margin:0;background:#0e192d;color:#edf2fa;font:16px system-ui;padding:24px;line-height:1.7}main{max-width:440px;margin:8vh auto}h1{line-height:1.1;color:#e8c889}p{font-size:14px}button,a{display:block;width:100%;box-sizing:border-box;border:1px solid #8c9db5;border-radius:8px;padding:12px;background:#253753;color:#fff;font:inherit;text-align:center;text-decoration:none;margin:12px 0}button:disabled{opacity:.5}small{color:#b9c9df}</style><main><small>CAMPUS LEGENDS / RECOVERY</small><h1>起動の復旧</h1><p>先にホーム画面から起動したゲームを完全に終了してください。セーブデータやキャッシュの消去、アンインストールは行いません。</p><p id="status" role="status" aria-live="polite">通信できる状態で下のボタンを押してください。</p><button id="go">更新を確認して復旧</button><a href="./">ゲームに戻る</a><small>更新に失敗した場合は、時間をおいて再試行してください。</small></main><script>const statusEl=document.getElementById('status'),btn=document.getElementById('go');const show=t=>statusEl.textContent=t;const delay=t=>new Promise(r=>setTimeout(r,t));navigator.serviceWorker?.addEventListener('message',e=>{if(e.data?.type==='CL52_UPDATE')show({download:'新しい本体を取得中…',verify:'本体を確認中…',ready:'更新準備完了',error:'取得に失敗しました'}[e.data.phase]||(e.data.phase==='assets'?`オフライン素材 ${e.data.count}/${e.data.total}件`:'更新中…'))});btn.onclick=async()=>{btn.disabled=true;try{if(!navigator.serviceWorker)throw Error();show('更新を確認中…');let r=await Promise.race([navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}),delay(15000).then(()=>{throw Error()})]);await Promise.race([r.update(),delay(15000).then(()=>{throw Error()})]);for(let i=0;i<1200;i++){if(r.waiting){show('更新を適用中…');const w=r.waiting;w.postMessage({type:'CL_ACTIVATE'});for(let j=0;j<30&&w.state!=='activated';j++)await delay(500);if(w.state!=='activated')throw Error();break}if(!r.installing)break;await delay(500)}if(r.installing||r.waiting||!r.active)throw Error();const channel=new MessageChannel();const version=await Promise.race([new Promise(resolve=>{channel.port1.onmessage=e=>resolve(e.data?.version);r.active.postMessage({type:'CL52_STATUS'},[channel.port2])}),delay(4000).then(()=>null)]);channel.port1.close();if(!version)throw Error();show('復旧処理が完了しました。ゲームに戻ってバージョンを確認してください。');}catch(e){show('更新を完了できませんでした。通信を確認し、再試行してください。セーブは消去していません。')}finally{btn.disabled=false}};</script></html>
