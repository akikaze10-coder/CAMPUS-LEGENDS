/* Large cinematic reward tiers: purple SSR, rainbow gold UR, radiant LEGEND */

.rarity-cinematic:before{content:'';position:absolute;inset:-90%;background:conic-gradient(from 0deg,transparent 0 11deg,#b6c2ff38 15deg,transparent 23deg 39deg,#ffdaa947 42deg,transparent 53deg 71deg,#ffffff2c 75deg,transparent 81deg);animation:raritySpin 8s linear infinite}
.rarity-cinematic.rarity-level-5:before{background:repeating-conic-gradient(#ffe2a12d 0deg 6deg,transparent 7deg 18deg);animation-duration:5s}
.rarity-halo{position:absolute;width:300px;height:300px;border-radius:50%;border:2px solid #eed8ffd4;box-shadow:0 0 0 15px #e9d3ff12,0 0 0 52px #edccff0c,0 0 120px #a96cf7cc;animation:rarityHalo 1.3s ease-in-out infinite alternate;pointer-events:none}
.rarity-level-4 .rarity-halo{border-color:#a7eaff;box-shadow:0 0 0 17px #d3fdff19,0 0 0 55px #c4eafa0a,0 0 110px #8cdeffaa}
.rarity-level-5 .rarity-halo{border-color:#ffefa9;box-shadow:0 0 0 18px #ffe9a522,0 0 0 53px #ffb33915,0 0 130px #f7cb71df}
.rarity-label{font:900 14px/1.1 Georgia,'Yu Mincho',serif;z-index:2;color:#fff7cd;letter-spacing:.2em;text-shadow:0 0 25px #fff5b9;animation:rarityLabel .65s cubic-bezier(.2,.8,.2,1) both}
.rarity-card{width:min(64vw,235px);position:relative;z-index:3;filter:drop-shadow(0 0 24px #b98cf4);animation:rarityCard .85s cubic-bezier(.1,.8,.2,1.05) both}
.rarity-level-4 .rarity-card{filter:drop-shadow(0 0 33px #86ddff)}

.rarity-name{text-align:center;position:relative;z-index:4;font-size:19px;color:#fff8e0;font-weight:900;text-shadow:0 1px 10px #000}

.rarity-stars{z-index:4;font-size:25px;color:#ffe6a2;letter-spacing:.05em;text-shadow:0 0 16px #fff1af}
.rarity-skip{z-index:10;position:absolute;right:14px;top:calc(16px + env(safe-area-inset-top,0px));border:1px solid #f6e8b87a;background:#142139ba;border-radius:100px;color:#ffefb9;padding:8px 13px;font-size:12px;font-weight:900}
.rarity-stardust{position:absolute;inset:0;z-index:1;pointer-events:none;display:grid;place-items:center}
.rarity-stardust i{position:absolute;width:6px;height:18px;border-radius:100px;background:#f0d7ff;box-shadow:0 0 17px #ffe2a3;transform:rotate(var(--a)) translateX(var(--r));animation:raritySpark 1.7s var(--d) ease-out infinite}
.rarity-level-5 .rarity-stardust i{background:#ffe6a3}
@keyframes rarityIn{from{opacity:0}to{opacity:1}}@keyframes raritySpin{to{transform:rotate(360deg)}}@keyframes rarityHalo{to{transform:scale(1.2);opacity:.68}}@keyframes rarityCard{0%{opacity:0;transform:translateY(85px) scale(.52) rotateY(80deg)}65%{opacity:1;transform:translateY(-18px) scale(1.1)}100%{transform:none;opacity:1}}
@keyframes rarityLabel{from{opacity:0;transform:translateY(-25px) scale(1.3)}to{opacity:1;transform:none}}@keyframes raritySpark{0%{opacity:0;scale:.2}30%{opacity:1;scale:1}100%{opacity:0;scale:.4;rotate:35deg}}
/* Full character action cut-in for challenging skills, short ribbon for simpler conditional skills */
.skill-cutin{position:fixed;inset:0;z-index:145;pointer-events:none;overflow:hidden;isolation:isolate;background:radial-gradient(circle at 25% 50%,#435dacbb,transparent 62%),linear-gradient(105deg,#061127c7,#10172ce0);animation:cutinFade .95s both}

.cutin-beams{position:absolute;inset:0;pointer-events:none;display:grid;place-items:center}

@keyframes cutinFade{0%{opacity:0}12%{opacity:1}77%{opacity:1}100%{opacity:0}}@keyframes cutinSlide{0%{opacity:0;transform:translateX(-40vw) scale(.94)}55%{opacity:1;transform:translateX(3vw) scale(1.03)}100%{opacity:1;transform:none}}@keyframes cutinWords{from{opacity:0;transform:translateX(45vw)}to{opacity:1;transform:none}}@keyframes cutinBeams{from{opacity:0;scale:.1}to{opacity:.5;scale:1}}@keyframes cutinStreak{from{opacity:0;translate:-120% 0}55%{opacity:.7}to{opacity:0;translate:130% 0}}

/* Card: one coherent non-overlapping grid; short cards show less detail, not scaled-down prose. */
.ucard.cl-card{--tier:#a2b5d3;--tierLight:#f2f8ff;--accent:#49679b;position:relative;display:grid!important;grid-template-rows:13% 46% minmax(0,1fr) 17%;gap:0;padding:0;aspect-ratio:.73!important;width:100%;height:auto;min-width:0;min-height:0;overflow:hidden;border-radius:12px;background:linear-gradient(154deg,var(--tierLight),#f5f8ff 30%,#dfe9fa);border:2px solid var(--tier)!important;color:#172a4b;isolation:isolate;box-shadow:0 5px 12px #263a6c45,0 0 0 1px #ffffffb3 inset}
.ucard.cl-card.n{--tier:#9baecc;--tierLight:#ecf4ff;--accent:#496a9a}
.ucard.cl-card.r{--tier:#49c0e0;--tierLight:#e2faff;--accent:#177ca5}
.ucard.cl-card.sr{--tier:#a295ee;--tierLight:#f2eaff;--accent:#7759b9}
.ucard.cl-card.ssr{--tier:#f0a5d8;--tierLight:#fff0fb;--accent:#aa4d9f}
.ucard.cl-card.ur{--tier:#f6c36b;--tierLight:#fff5d7;--accent:#ab6d2a}
.ucard.cl-card.legend{--tier:#ffda79;--tierLight:#fff1c2;--accent:#a65d28}
.ucard.cl-card::before{display:none!important}.ucard.cl-card::after{z-index:9;pointer-events:none}
.ucard.cl-card .cl-frame{position:absolute;inset:0;z-index:8;pointer-events:none;background-repeat:no-repeat;background-size:100% 100%;opacity:.90}
.ucard.cl-card .cl-head{display:flex;align-items:center;justify-content:space-between;gap:3px;padding:2px 7px 0;min-width:0;overflow:hidden;position:relative;z-index:3}
.ucard.cl-card .cl-rarity{font-family:Georgia,'Times New Roman',serif;color:var(--accent);font-size:clamp(7px,1.9vw,10px);font-weight:1000;letter-spacing:.025em;white-space:nowrap;line-height:1}
.ucard.cl-card .cl-stars{font-size:clamp(5px,1.6vw,9px);color:#df901c;white-space:nowrap;letter-spacing:-.13em;line-height:1;max-width:58%;overflow:hidden;text-align:right}
.ucard.cl-card .cl-art{position:relative;min-width:0;min-height:0;overflow:hidden;margin:0 5px;background:linear-gradient(145deg,var(--c1),var(--c2));border:1px solid #ffffff99;border-radius:6px 6px 2px 2px;box-shadow:0 0 0 1px var(--tier) inset}
.ucard.cl-card .cl-art img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 49%;background:var(--c2)}
.ucard.cl-card .cl-art::after{content:'';position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 1px 8px #ffffff77,inset 0 -1px 8px #142a4b46}
.ucard.cl-card .cl-metadata{padding:3px 7px 0;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:2px;min-height:0;overflow:hidden;position:relative;z-index:3}
.ucard.cl-card .cl-uni{font-family:'Yu Mincho','Hiragino Mincho ProN',Georgia,serif;font-weight:1000;font-size:clamp(10px,2.8vw,15px);letter-spacing:-.04em;color:#1b3158;line-height:1.09;overflow:hidden;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.ucard.cl-card .cl-uni.long{font-size:clamp(8px,2.18vw,12px);line-height:1.07}
.ucard.cl-card .cl-dept{font-family:'Yu Gothic','Hiragino Kaku Gothic ProN',sans-serif;font-size:clamp(8px,2.25vw,11px);font-weight:900;color:#4b5b85;line-height:1.12;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.ucard.cl-card .cl-dept.long{font-size:clamp(7px,1.92vw,9.5px)}
.ucard.cl-card .cl-foot{min-width:0;min-height:0;display:flex;align-items:center;gap:3px;padding:0 7px 2px;justify-content:space-between;position:relative;z-index:3;border-top:1px solid #889ac635;background:linear-gradient(90deg,#e4ecffbb,#fff2db88)}
.ucard.cl-card .cl-skill{flex:1;min-width:0;color:#705691;font-weight:900;font-size:clamp(6px,1.75vw,9px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ucard.cl-card .cl-power{font:900 clamp(15px,4.3vw,25px)/1 Georgia,'Times New Roman',serif;color:#183564;text-shadow:0 1px #ffffff9e;flex:0 0 auto}
.ucard.cl-card.ur .cl-foot,.ucard.cl-card.legend .cl-foot{background:linear-gradient(90deg,#ffedbacc,#ffd6a4a8)}
.ucard.cl-card.selected{outline:3px solid #e9a64c;outline-offset:2px;transform:translateY(-2px)}
.ucard.cl-card.ownedless{filter:grayscale(.85) brightness(.66)}
/* 4-card hand: name and power only; ability always available through info button. */
.ucard.cl-card.compact{grid-template-rows:13% 46% minmax(0,1fr) 20%;border-radius:9px}
.ucard.cl-card.compact .cl-head{padding:1px 4px 0}.ucard.cl-card.compact .cl-rarity{font-size:7px}.ucard.cl-card.compact .cl-stars{font-size:5.5px}
.ucard.cl-card.compact .cl-art{margin:0 3px;border-radius:3px}
.ucard.cl-card.compact .cl-metadata{padding:2px 4px 0;gap:1px}
.ucard.cl-card.compact .cl-uni{font-size:clamp(7.5px,2.35vw,10px);-webkit-line-clamp:2;line-height:1.05}
.ucard.cl-card.compact .cl-uni.long{font-size:clamp(6px,1.95vw,8px)}
.ucard.cl-card.compact .cl-dept{font-size:clamp(6.7px,1.95vw,8px);-webkit-line-clamp:1;line-height:1.05}
.ucard.cl-card.compact .cl-skill{display:none}
.ucard.cl-card.compact .cl-foot{justify-content:flex-start;padding:1px 5px 2px}
.ucard.cl-card.compact .cl-power{font-size:clamp(14px,4vw,18px)}
/* On board the 54px slots are portraits with a simple bottom nameplate; no full card prose. */
.ucard.cl-card.mini{display:block!important;width:100%;height:100%;aspect-ratio:auto!important;border-radius:5px;box-shadow:none}
.ucard.cl-card.mini .cl-frame{opacity:.52}
.ucard.cl-card.mini .cl-miniart{position:absolute;inset:0;overflow:hidden;background:var(--c2)}

.ucard.cl-card.mini .cl-minicap{position:absolute;left:0;right:0;bottom:0;z-index:7;min-height:15px;display:flex;gap:2px;align-items:center;justify-content:space-between;background:linear-gradient(90deg,#162a4bf7,#2f3b5ce7);color:#fff;padding:2px 4px 1px}
.ucard.cl-card.mini .cl-mininame{font-size:clamp(6px,1.5vw,8px);font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ucard.cl-card.mini .cl-minipower{font:900 13px/1 Georgia,serif;color:#ffe09b;flex:0 0 auto}

.ucard.cl-card .cl-head{grid-row:1;z-index:7!important;padding:4px 10px 0!important;background:linear-gradient(180deg,rgba(255,255,255,.48),transparent);align-items:center!important}
.ucard.cl-card .cl-rarity{font-size:clamp(8px,2vw,11px)!important;letter-spacing:.09em;color:#31486a!important}
.ucard.cl-card .cl-stars{font-size:clamp(7px,1.75vw,10px)!important;letter-spacing:-.14em;color:#bf8533!important}
.ucard.cl-card .cl-art{grid-row:2;z-index:2!important;margin:0 8px!important;border-radius:6px!important;box-shadow:0 1px 0 1px rgba(255,255,255,.8);border:1px solid var(--tier)!important;overflow:hidden;background:linear-gradient(155deg,var(--c1),var(--c2))!important}
.ucard.cl-card .cl-art img{width:100%;height:100%;object-fit:cover;object-position:center 50%}
.ucard.cl-card .cl-metadata{grid-row:3;z-index:7!important;min-height:0;overflow:hidden;padding:7px 10px 1px!important;display:flex;justify-content:flex-start!important;gap:3px!important;background:transparent!important}
.ucard.cl-card .cl-uni{font-family:'Yu Mincho','Hiragino Mincho ProN',Georgia,serif;font-size:clamp(11px,3.2vw,16px)!important;line-height:1.09!important;font-weight:900!important;color:#1c3356!important;letter-spacing:-.02em!important;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.ucard.cl-card .cl-uni.long{font-size:clamp(9px,2.55vw,12px)!important}
.ucard.cl-card .cl-dept{font-size:clamp(8.5px,2.3vw,11px)!important;line-height:1.11!important;color:#4c6285!important;font-weight:850!important;-webkit-line-clamp:2}
.ucard.cl-card .cl-dept.long{font-size:clamp(7.5px,2vw,9px)!important}
.ucard.cl-card .cl-foot{grid-row:4;z-index:7!important;min-height:0;overflow:hidden;padding:1px 10px 4px!important;background:linear-gradient(90deg,rgba(232,240,253,.92),rgba(255,250,238,.91))!important;border-top:1px solid rgba(130,150,180,.18)!important}
.ucard.cl-card .cl-skill{font-size:clamp(6.5px,1.75vw,8.5px)!important;line-height:1.12!important;color:#625684!important}
.ucard.cl-card .cl-power{font-size:clamp(15px,4.4vw,23px)!important;color:#16335a!important}
/* small hand/pack cards need their own measured text hierarchy */
.ucard.cl-card.compact{grid-template-rows:11% 47% minmax(0,29%) 13%!important}
.ucard.cl-card.compact .cl-head{padding:1px 5px 0!important}
.ucard.cl-card.compact .cl-rarity{font-size:7px!important}
.ucard.cl-card.compact .cl-stars{font-size:6px!important}
.ucard.cl-card.compact .cl-art{margin:0 4px!important}
.ucard.cl-card.compact .cl-metadata{padding:2px 5px 1px!important;gap:1px!important}
.ucard.cl-card.compact .cl-uni{font-size:clamp(7px,2vw,10px)!important;line-height:1.08!important}
.ucard.cl-card.compact .cl-uni.long{font-size:clamp(6px,1.85vw,8px)!important}
.ucard.cl-card.compact .cl-dept{font-size:clamp(6px,1.75vw,8px)!important;line-height:1.08!important;-webkit-line-clamp:1!important}
.ucard.cl-card.compact .cl-foot{padding:1px 5px 3px!important}
.ucard.cl-card.compact .cl-power{font-size:clamp(12px,3.5vw,18px)!important}
.ucard.cl-card.mini{grid-template-rows:none!important;display:block!important}
.ucard.cl-card.mini .cl-frame{opacity:.52!important}
/* dark character silhouette, not the previous black rectangular image */
.ucard.cl-card.ownedless{filter:none!important;opacity:1!important}
.ucard.cl-card.ownedless .cl-art{background:linear-gradient(150deg,#e0e7f0,#bac8dd 65%,#99a9c6)!important}
.ucard.cl-card.ownedless .cl-art img{display:none!important}
.ucard.cl-card.ownedless .cl-art::before{display:none!important;content:none!important}
.ucard.cl-card.ownedless .cl-art::after{box-shadow:inset 0 0 18px rgba(25,40,70,.12)!important}
.cl-silhouette{display:block!important;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;transform:translateY(2%);filter:drop-shadow(0 2px 3px rgba(40,55,80,.15))}
.ucard.cl-card .cl-lock{position:absolute;z-index:9!important;right:6px;top:6px;padding:3px 5px;border-radius:5px;color:#fff;background:rgba(38,52,78,.92)!important;border:1px solid #e8effa;font-size:8px;line-height:1.1}
/* unobtrusive and tap-friendly five-icon modern dock; remove illustrated arch panel */
.bottomnav{left:50%!important;transform:translateX(-50%)!important;bottom:0!important;width:100%!important;max-width:540px!important;z-index:35!important;display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding:8px 9px calc(7px + env(safe-area-inset-bottom,0px))!important;background:linear-gradient(180deg,rgba(255,255,255,.97),rgba(236,244,255,.98))!important;border:1px solid #c6d5eb!important;border-bottom:0!important;border-radius:19px 19px 0 0!important;box-shadow:0 -7px 27px rgba(36,67,114,.17)!important;backdrop-filter:blur(14px)}
.bottomnav::before{display:none!important;content:none!important;background:none!important}
.navitem{background:transparent!important;color:#527098!important;border-radius:12px!important;min-height:59px!important;padding:3px 2px 5px!important;display:flex!important;align-items:center!important;justify-content:center!important;flex-direction:column!important;gap:4px!important;text-shadow:none!important;box-shadow:none!important;transform:none!important;min-width:0!important}
.navitem .navico{background:#eef3fb!important;border:1px solid #dce6f4!important;border-radius:12px!important;width:35px!important;height:32px!important;display:grid!important;place-items:center!important;font-size:20px!important;color:#56749b!important;filter:none!important}
.navitem .navlabel{font-size:10px!important;color:#536d91!important;letter-spacing:0!important;white-space:nowrap;text-shadow:none!important}
.navitem.active{background:#e7f0ff!important;color:#1d4b88!important;box-shadow:inset 0 0 0 1px #c5dafb!important}
.navitem.active .navico{background:linear-gradient(160deg,#487ec6,#2459a5)!important;border-color:#2c67b5!important;color:#fff!important;box-shadow:0 3px 10px rgba(52,105,186,.25)!important}
.navitem.active .navlabel{color:#214e8a!important;font-weight:900!important}
.app{padding-bottom:calc(87px + env(safe-area-inset-bottom,0px))!important}
/* info taps should sit off text and never under the trim */
.hand-inspect{right:4px!important;bottom:5px!important;top:auto!important;z-index:15!important}
.slot-inspect{right:2px!important;bottom:2px!important;z-index:15!important}
@media(max-width:365px){.ucard.cl-card .cl-metadata{padding:5px 7px 1px!important}.ucard.cl-card .cl-uni{font-size:10px!important}.ucard.cl-card .cl-uni.long{font-size:8px!important}.ucard.cl-card .cl-dept{font-size:7.7px!important}.ucard.cl-card .cl-dept.long{font-size:7px!important}.ucard.cl-card .cl-foot{padding:1px 7px 3px!important}.navitem .navico{width:33px!important;height:30px!important}.navitem .navlabel{font-size:9px!important}}

/* CAMPUS LEGENDS v0.15 — one card hierarchy across collection, pack, deck and hand */
/* Grid rows: rarity 10% / true edge-to-edge character image 50% / name 26% / skill and power 14% */
.ucard.cl-card:not(.mini),
.ucard.cl-card.compact:not(.mini){
  position:relative!important;display:grid!important;
  grid-template-columns:minmax(0,1fr)!important;
  grid-template-rows:10% 50% minmax(0,26%) 14%!important;
  gap:0!important;aspect-ratio:.73!important;
  background:linear-gradient(165deg,var(--tierLight),#f4f7ff 45%,#e8effa)!important;

/* v0.24: pickup motion fix + lightweight collection cards */
.pickup-card{animation:none!important;}
.pickup-card-shell{animation:pickupCardSwing 3.1s ease-in-out infinite;transform-origin:50% 82%;will-change:transform;}
.pickup-card-shell .ucard{pointer-events:none;}
@keyframes pickupCardSwing{
  0%,100%{transform:translateY(0) rotate(-4deg) scale(1)}
  25%{transform:translateY(-3px) rotate(-1.5deg) scale(1.012)}
  50%{transform:translateY(-7px) rotate(2.8deg) scale(1.018)}
  75%{transform:translateY(-2px) rotate(.6deg) scale(1.01)}
}
.collection-screen .cardgrid{gap:10px!important}
.ucard.collection-lite{aspect-ratio:.74;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;background:linear-gradient(180deg,#10203d,#0b1326 88%);border:1px solid #c7d9ff33;box-shadow:0 6px 14px #0005;}
.ucard.collection-lite:before,.ucard.collection-lite:after{display:none!important}
.ucard.collection-lite .lite-top{display:flex;justify-content:space-between;align-items:center;padding:8px 9px 4px;font-weight:900;letter-spacing:.04em;color:#eef5ff;font-size:10px}
.ucard.collection-lite .lite-rarity{padding:3px 6px;border-radius:999px;background:#ffffff15;border:1px solid #ffffff2a}
.ucard.collection-lite .lite-power{font:700 18px/1 Georgia,'Times New Roman',serif;color:#fff2c8}
.ucard.collection-lite .lite-art{position:relative;flex:1;min-height:0;margin:0 8px;border-radius:10px;overflow:hidden;background:linear-gradient(160deg,var(--c1),var(--c2));display:grid;place-items:center}
.ucard.collection-lite .lite-art img,.ucard.collection-lite .lite-art .cl-silhouette-wrap{width:100%;height:100%;object-fit:cover}
.ucard.collection-lite .lite-art .cl-silhouette-wrap{background-size:78%!important;background-position:center 18%!important}
.ucard.collection-lite .lite-lock{position:absolute;left:50%;top:50%;translate:-50% -50%;padding:5px 10px;border-radius:999px;background:#091122d4;border:1px solid #ffffff55;font-size:11px;font-weight:900}
.ucard.collection-lite .lite-body{padding:8px 9px 10px;display:grid;gap:4px}
.ucard.collection-lite .lite-uni{font-size:11px;font-weight:900;line-height:1.2;color:#fff}
.ucard.collection-lite .lite-uni.long{font-size:10px}
.ucard.collection-lite .lite-dept{font-size:9px;line-height:1.25;color:#d9e4f8;min-height:23px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.ucard.collection-lite .lite-dept.long{font-size:8px}
.ucard.collection-lite .lite-tags{display:flex;gap:4px;flex-wrap:wrap}
.ucard.collection-lite .lite-tags span{font-size:8px;padding:2px 5px;border-radius:999px;background:#ffffff12;border:1px solid #ffffff1f;color:#eef6ff}
.cl74-group-badge{position:absolute;left:8px;top:36px;z-index:4;display:inline-flex;align-items:center;gap:4px;max-width:calc(100% - 16px);padding:3px 7px;border-radius:999px;background:linear-gradient(180deg,#0a1528ee,#152746e6);border:1px solid #f3e5b366;box-shadow:0 3px 8px #0005;color:#fef6dd;font-size:10px;font-weight:900;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cl74-group-badge .cl74-group-kicker{font-size:8px;color:#f1c86f;letter-spacing:.08em}.cl74-group-badge b{font-size:10px;overflow:hidden;text-overflow:ellipsis}.cl74-group-badge small{font-size:8px;color:#d5e5ff}.ucard.collection-lite .cl74-group-badge{left:12px;top:46px;max-width:calc(100% - 24px);padding:3px 6px;font-size:9px}.ucard.collection-lite .cl74-group-badge b{font-size:9px}.deck-edit-screen .ucard .cl74-group-badge{top:34px}.ucard.compact .cl74-group-badge,.ucard.mini .cl74-group-badge{display:none}
.collection-screen .collection-thumb{content-visibility:auto;contain-intrinsic-size:auto 250px;contain:layout paint style;}

.collection-screen #collectionResults{contain:content}

/* CAMPUS LEGENDS v0.26 / one-screen, full-width battlefield */
/* Prevent floating sound-toggle from shrinking the grid (root cause of right-side blank). */
.battle-screen .opponentline{display:flex!important;align-items:center!important;justify-content:space-between!important;gap:5px!important;clear:both!important;width:100%!important}
.battle-screen .opponentline .sound-toggle{float:none!important;margin:0!important}
.battle-screen .arena{clear:both!important;width:100%!important;max-width:none!important;min-width:0!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;}
.battle-actions{display:flex;gap:5px;align-items:center;flex:0 0 auto}
.battle-retire-mini{padding:3px 7px;border-radius:8px;border:1px solid #d6def0;background:#f8fafe;color:#6b7992;font-size:9px;font-weight:750}

/* A real layout reserved between the page header and bottom navigation.
   Never rely on document scrolling to access the hand or board. */
.app:has(.battle-screen){--bt-top:48px;--bt-nav:62px;height:100dvh!important;min-height:0!important;max-height:100dvh!important;padding-bottom:0!important;overflow:hidden!important;}
.app:has(.battle-screen) .topbar{height:var(--bt-top)!important;min-height:0!important;padding:5px 11px!important;}
.app:has(.battle-screen) .topbar .mark{font-size:13px!important}
.app:has(.battle-screen) .bottomnav{height:var(--bt-nav)!important;min-height:0!important;padding:0 5px env(safe-area-inset-bottom,0px)!important;}
.app:has(.battle-screen) .bottomnav .navitem{height:100%!important;min-height:0!important;padding-top:4px!important;padding-bottom:2px!important}
.app:has(.battle-screen) .bottomnav .navico{font-size:19px!important;line-height:20px!important}
.app:has(.battle-screen) .bottomnav .navitem small{font-size:9px!important}
.battle-screen{height:calc(100dvh - var(--bt-top,48px) - var(--bt-nav,62px) - 8px)!important;min-height:0!important;max-height:none!important;overflow:hidden!important;display:flex!important;flex-direction:column!important;gap:0!important;padding:5px 5px 4px!important;}

.battle-screen>.opponentline{flex:0 0 21px!important;height:21px!important;min-height:0!important;font-size:10px!important;margin:0 0 2px!important;line-height:1!important;}
.battle-screen .sound-toggle{font-size:9px!important;padding:3px 7px!important;line-height:1.1!important}
.battle-screen>.arena{flex:1 1 0!important;min-height:0!important;max-height:none!important;gap:4px!important;align-content:stretch!important;}

function scoreSide(ids,zone){const cs=ids.map(id=>CARD_BY_ID[id]).filter(Boolean);let base=0,bon=0,combo=0,skill=0,group=0,names=[],skillNames=[];for(const c of cs){base+=c.p;let n=0;switch(zone.mode){case'field':n=c.field===zone.value?zone.bonus:0;break;case'region':n=c.region===zone.value?zone.bonus:0;break;case'regional':n=(!['関東','近畿'].includes(c.region))?zone.bonus:0;break;case'public':n=c.type!=='pri'?zone.bonus:0;break;case'private':n=c.type==='pri'?zone.bonus:0;break;case'low':n=rarityIndex(c.rarity)<=2?zone.bonus:0;break;case'high':n=rarityIndex(c.rarity)>=3?zone.bonus:0;break;}bon+=n;const sp=skillPower(c,cs,zone);skill+=sp;if(sp>0)skillNames.push(getSkill(c).name+' +'+sp)}if(cs.length===2){if(cs[0].uni===cs[1].uni){combo+=5;names.push('同大学 +5')}if(cs[0].region===cs[1].region){const rv=cs[0].region==='関東'?1:2;combo+=rv;names.push('同地方 +'+rv)}if(cs[0].field===cs[1].field){combo+=3;names.push('同系統 +3')}else{combo+=2;names.push('異分野 +2')}if(zone.mode==='diverse'&&cs[0].field!==cs[1].field){combo+=zone.bonus;names.push('文理融合 +6')}if(zone.mode==='sameuni'&&cs[0].uni===cs[1].uni){combo+=zone.bonus;names.push('同大学連携 +7')}if(zone.mode==='sameregion'&&cs[0].region===cs[1].region){const rv=cs[0].region==='関東'?2:zone.bonus;combo+=rv;names.push('地域連携 +'+rv)}const g=pairGroup(cs[0],cs[1]);if(g){group=g.bonus;names.push(g.name+' +'+g.bonus)}}return {total:base+bon+combo+skill+group,base,bon,combo,skill,group,names,skillNames}}

function calculateWins(b){let w=0,l=0,t=0,rs=[];for(let i=0;i<3;i++){let z=ZONES.find(z=>z.id===b.zones[i]);let p=scoreSide(b.player[i],z).total,e=scoreSide(b.enemy[i],z).total;if(p>e)w++;else if(p<e)l++;else t++;rs.push({p,e,z:z.name})}return {w,l,t,rs,win:w>l||(w===l&&w>0&&rs.reduce((a,x)=>a+x.p-x.e,0)>0)}}

function settingsModal(){return `<div class="modalbar"><b>設定・遊び方</b><button class="close" data-act="close">×</button></div><div class="guide"><h3>ルール</h3><p>1. 対戦前に所持カードから12枚を編成。<br>2. 毎ターン、手札を1枚選んで3エリアのどこかに配置。各エリアは自分のカードを2枚まで置けます。<br>3. 6ターン終了後、より高い戦力を出したエリアを獲得。より多くのエリアを獲得した側が勝利。2エリア獲得すれば確定勝利。獲得数が同じ場合は合計戦力で判定します。</p><h3>ボーナスとコンボ</h3><p>カードのスキルは条件を満たしたときだけ加点され、条件達成で加点。カード表面には能力名のみ表示。専用キャラカードは図鑑の「✦ 専用キャラ」で一覧できます。対戦中はカードの ⓘ を押すと詳しい効果を確認できます。同じ大学の2枚で+5、同じ大学群の異大学の2枚で+4〜6、同じ地方で+2（関東のみ+1）、同じ系統で+3、違う系統でも+2。エリア効果とも重複します。大学群は公式提携を意味しない一般的な受験業界の通称と、ゲーム独自連携が混在します。強いカードを単独で置くより、組み合わせが大事です。</p><h3>偏差値とゲーム戦力</h3><p>学部ごとの「参考偏差値」は初期試作の仮設定です。国立は+4、公立は+2.5。国立の理工・医療・情報理系には一律+2.5を上乗せし、医療系だけの特別加算はありません。国際教養大学は個別に-3.0の調整を加えたモデル上の補正を加えた「換算後難易度」から戦力・レア度を作っています。実際の偏差値や大学の優劣、入試方式を正確に表す数値ではありません。</p><h3>ナビゲーター・効果音</h3><p>青瀬灯のヒントは対戦中に折りたためます。スキル、連携、大学群コンボにはそれぞれ異なるエフェクトと効果音があります。</p><h3>指名スカウトと収集アルバム</h3><p>地方スカウトは対象の同レア内抽選重み4倍、学部別は5倍（全国は日替わりピックアップ3倍）。SSR以上確定は5枚中1枚がSSRまたはURです。5連ごとに交換ポイント5ptを確定付与。全国ガチャには560Gの「SSR以上確定ガチャ」も追加され、5枚のうち1枚はSSRまたはURが確定します（通常天井カウントとは別扱い）。アルバムの達成報酬は各段階一度限りです。</p><h3>セーブデータ</h3><p>同じブラウザ内に自動保存。別のブラウザ・端末への移行は下の保存データ書き出しと読み込みを利用してください。</p><div class="btnrow"><button class="btn quiet" data-act="sound">サウンド ${sounds?'ON':'OFF'}</button><button class="btn quiet" data-act="export">セーブを書き出す</button></div><div class="space"></div><label class="btn quiet full" for="importSave" style="cursor:pointer">セーブを読み込む</label><input type="file" accept="application/json,.json" id="importSave" style="display:none"/><div class="space"></div><button class="btn warn full" data-act="reset">全データを初期化</button><p class="tiny" style="margin-top:16px">CAMPUS LEGENDS v${VERSION} / 大学名・学部名は実在しますが能力・人物は非公式の架空設定。大学公式ロゴ・校章は使用していません。</p></div>`}

function v33ThemeFromCard(c){
 const d=c.dept;
 if(/医学|医療|保健|看護/.test(d) && !/獣/.test(d))return 'medical';
 if(/歯/.test(d))return 'dental';
 if(/薬/.test(d))return 'pharma';
 if(/法|政治/.test(d))return 'law';
 if(/経済|商|経営|社会|政策|データ/.test(d))return 'social';
 if(/情報|工|理工|理学院|基幹理工|創造理工|先進理工/.test(d))return 'tech';
 if(/農|生命|獣|環境|生物|水産/.test(d))return 'life';
 if(/教育|芸術|映像|デザイン|芸工/.test(d))return 'creative';
 if(/文|外国語|国際|教養|人文|文化|言語/.test(d))return 'humanities';
 if(c.field==='M')return 'medical';
 if(c.field==='S' || c.field==='I')return 'tech';

 if(c.field==='E')return 'creative';

}

function v38RecordBattle(b){if(b.v38Recorded||!b.result||b.player.flat().length!==6)return;b.v38Recorded=true;const r=b.result,st=v38Stats(),combo=computeBattleCombo(b.player);v38WeekAdd('win',r.win?1:0);v38WeekAdd('zones',r.w);const w=v38Week(),date=tod();if(!w.activeDates.includes(date)){w.activeDates.push(date);v38WeekAdd('activeDays')}if(combo){v38WeekAdd('combo');if(combo.stage>=5)v38WeekAdd('combo5');for(let n=4;n<=combo.stage;n++)st['combo'+n]=(st['combo'+n]||0)+1}b.v38Combo=combo?{label:combo.label,stage:combo.stage,bonus:combo.bonus}:null}

function finishBattle(b){if(b.over)return;const prior=new Set(Object.keys(v38TitleMap())),cup=b.mode==='gakuha'?v37StageCup(b.stage):null,prev=cup?gakuhaState(cup.id).cleared:0;v38FinishBattleBase(b);v38RecordBattle(b);v38SyncTitles();b.v38NewTitles=V38_TITLES.filter(t=>v38TitleMap()[t[0]]&&!prior.has(t[0])).map(t=>t[1]);if(cup&&prev<cup.count&&gakuhaState(cup.id).cleared===cup.count)b.v38CupCrown=cup.name;}

function v40Changes(b,before,after,comboBefore){const skills=[],combos=[],feed=[];for(const side of ['player','enemy']){const opp=side==='player'?'enemy':'player',label=side==='player'?'自軍':'敵軍';for(let i=0;i<3;i++){for(const id of b[side][i]){const old=before[side][i].applied[id]||0,next=after[side][i].applied[id]||0;if(old===next)continue;const c=CARD_BY_ID[id],target=v40Target(c,b[opp][i].map(x=>CARD_BY_ID[x]));const ev={side,i,id,old,next,name:getSkill(c).name,reason:target?`${target.kind}：${target.card.uni}・${target.card.dept}`:v39Spec(c)?'専門領域で覚醒':'エリア内の発動条件',target:target?.card.id||null};if(next>old){skills.push(ev);feed.push(`${label}・${ev.name} ${old?'強化 ':''}+${next}${target?'（'+target.card.uni+'・'+target.card.dept+'）':''}`)}else feed.push(`${label}・${ev.name} ${old}→${next}（能力再計算）`);}}

function v40Stage(kind,html,ms,voiceChoices=[]){const enemy=kind.split(' ').includes('rival');if(enemy)voiceChoices=[];if(v40Skip||screen!=='battle')return Promise.resolve();document.querySelector('.v40-stage')?.remove();const speed=v42Speed(),k=speed==='fast'?.55:speed==='minimal'?.24:1;let actual=Math.round(ms*k);if(speed==='fast')actual=Math.max(actual,kind==='reaction'?1050:kind.startsWith('combo')?950:850);if(speed==='minimal')actual=Math.max(actual,kind.startsWith('combo')?420:250);if(enemy)actual=Math.min(actual,speed==='standard'?Math.round(ms*.77):speed==='fast'?750:420);const el=document.createElement('div');el.className=`v40-stage ${kind} v45-${speed} cl49-cinematic cl60-stage${kind==='final'&&s.battle&&calculateWins(s.battle).win?' cl60-victory':''}${enemy?' cl57-enemy':''}`;el.setAttribute('role','status');el.style.setProperty('--cl49-time',actual+'ms');el.innerHTML=`<div class="cl49-shards" aria-hidden="true"><i></i><i></i><i></i></div><div class="cl80-cut-wrap"><div class="v40-stage-inner">${html}<div class="cl60-timeline" aria-hidden="true"><i></i></div></div></div>`;document.body.append(el);const skip=document.querySelector(".v40-skip");if(skip)el.querySelector(".cl80-cut-wrap").append(skip);v56PlayStage(voiceChoices,actual);return v40Wait(actual/k).then(()=>{v56Stop();if(skip?.isConnected)document.body.append(skip);el.remove()})}
