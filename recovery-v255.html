<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAMPUS LEGENDS 起動復旧</title><style>body{background:#101c32;color:#e8edf9;font:16px/1.7 system-ui,sans-serif;margin:0;padding:24px}main{max-width:560px;margin:6vh auto}h1{font-size:26px;letter-spacing:.03em}button,a{display:block;box-sizing:border-box;width:100%;margin:14px 0;padding:14px;color:#101c32;background:#e8d9a7;border:0;border-radius:9px;font:inherit;font-weight:bold;text-align:center;text-decoration:none}[hidden]{display:none!important}button:disabled{opacity:.5}small{color:#b7c9df}#status{white-space:pre-wrap;min-height:3em;border-left:3px solid #cbb785;padding-left:12px}</style></head><body><main><small>CAMPUS LEGENDS · RECOVERY</small><h1>ゲームの起動を復旧する</h1><p>ゲーム本体だけを更新します。セーブデータや保存済み素材は削除しません。</p><button id="repair">修正版を取得する</button><p id="status" role="status" aria-live="polite">通信できる状態でボタンを押してください。</p><a id="open" href="./" hidden>ゲームを開く</a><small>更新できない場合は、他のゲーム画面をすべて閉じてから再試行してください。サイトデータの削除は不要です。</small></main><script>
(()=>{'use strict';const button=document.getElementById('repair'),status=document.getElementById('status'),open=document.getElementById('open');const scope=new URL('./',location.href).href;let running=false;const sleep=ms=>new Promise(r=>setTimeout(r,ms));function version(worker){return new Promise(resolve=>{if(!worker){resolve('');return}const ch=new MessageChannel(),timer=setTimeout(()=>{ch.port1.close();resolve('')},700);ch.port1.onmessage=e=>{clearTimeout(timer);ch.port1.close();resolve(e.data?.version||'')};try{worker.postMessage({type:'CL52_STATUS'},[ch.port2])}catch(_){clearTimeout(timer);ch.port1.close();resolve('')}})}function fixed(v){const n=v.split('.').map(Number);return n.length===3&&(n[0]>0||n[1]>=255)}async function repair(){if(running)return;running=true;button.disabled=true;open.hidden=true;try{if(!('serviceWorker' in navigator))throw Error('このブラウザでは更新機能を利用できません。');status.textContent='修正版の確認中…';let reg=await navigator.serviceWorker.getRegistration(scope);if(!reg||reg.scope!==scope)reg=await navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'});else await reg.update();const end=Date.now()+45000;while(Date.now()<end){if(reg.waiting&&fixed(await version(reg.waiting)))reg.waiting.postMessage({type:'CL_ACTIVATE'});const v=await version(navigator.serviceWorker.controller);if(fixed(v)){status.textContent='復旧完了（v'+v+'）。ゲームを開いてください。';open.href=scope+'?recovered='+Date.now();open.hidden=false;return}status.textContent='修正版を取得・有効化しています…';await sleep(500)}throw Error('更新の有効化を確認できませんでした。通信と公開バージョンを確認して再試行してください。')}catch(e){status.textContent='復旧できませんでした。\n'+e.message}finally{running=false;button.disabled=false}}button.addEventListener('click',repair)})();
</script></body></html>
